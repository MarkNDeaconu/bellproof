<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bellproof · icon specimen</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --card:#FBFAF7; --paper:#F4F2ED; --paper-2:#ECE9E1; --ink:#0E1424; --ink-2:#16203A; --hair:#DEDBD3; --hair-strong:#C9C5BB;
      --hair-dark:#2A3655; --soft:#475069; --muted:#5C667F; --blue:#2F5BEA; --azure:#8FAEFF; --mist:#C9D5FA; --indigo:#6331DF;
      --alert:#C0105E; --on-dark:#F4F2ED; --on-dark-body:#B9C2D6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--card); color: var(--ink); font: 16px/24px "IBM Plex Sans", system-ui, sans-serif; }
    h1, h2, h3, h4 { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500; margin: 0; }
    h1 { font-size: 32px; line-height: 40px; }
    h2 { font-size: 20px; line-height: 28px; margin: 0 0 16px; }
    h4 { font-size: 20px; line-height: 28px; }
    .mono { font: 13px/20px "JetBrains Mono", ui-monospace, Menlo, monospace; }
    .micro { font: 500 12px/16px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; }
    main { padding: 40px; display: grid; gap: 48px; }
    header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; }
    #parity { padding: 4px 12px; border-radius: 4px; background: var(--paper); }
    #parity.pass { background: #E3F0E6; } #parity.fail { background: #F9E1EC; color: var(--alert); }

    /* specimen grids (integer geometry) */
    .sgrid { display: grid; gap: 1px; background: var(--hair); border: 1px solid var(--hair); width: max-content; }
    .sgrid > div { background: var(--card); }
    .sgrid .sh { font: 500 12px/16px ui-monospace, Menlo, monospace; color: var(--soft); padding: 8px 12px; height: 32px; }
    .sgrid .lbl { font: 12px/16px ui-monospace, Menlo, monospace; color: var(--soft); padding: 12px; }
    .sgrid .sc { padding: 12px; }
    .sgrid .sc > * { display: block; }
    .sgrid .paper { background: var(--paper); color: var(--ink); }
    .sgrid .ink { background: var(--ink); color: var(--on-dark); }
    /* specimen tables */
    table.spec { border-collapse: collapse; }
    table.spec th, table.spec td { border: 1px solid var(--hair); padding: 12px; vertical-align: middle; text-align: left; }
    table.spec th { font: 500 12px/16px ui-monospace, Menlo, monospace; color: var(--soft); background: var(--card); }
    table.spec td.lbl { font: 12px/16px ui-monospace, Menlo, monospace; color: var(--soft); white-space: nowrap; }
    table.spec td.ink { background: var(--ink); border-color: var(--hair-dark); color: var(--on-dark); }
    table.spec td.paper { background: var(--paper); color: var(--ink); }
    .row { display: flex; align-items: center; gap: 16px; }
    .icon { display: block; }

    /* context components (proxies of design-spec §4) */
    .ctx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
    .ctx > div { background: var(--card); padding: 32px; display: grid; gap: 20px; align-content: start; }
    .ctx > div > .micro { color: var(--soft); }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 4px; border: 0; font: 500 15px/1 "Space Grotesk", system-ui, sans-serif; cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--ink); color: var(--on-dark); }
    .btn.primary:hover { background: var(--ink-2); }
    .btn.outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair-strong); }
    .btn.outline:hover { background: var(--paper); box-shadow: inset 0 0 0 1px var(--ink); }
    .btn.ghost-dark { background: rgba(244,242,237,.08); color: var(--on-dark); }
    .btn.ghost-dark:hover { background: rgba(244,242,237,.14); }
    a.text { color: inherit; display: inline-flex; gap: 8px; align-items: center; text-decoration: underline; text-underline-offset: 3px; }
    .nav { display: flex; height: 49px; border: 1px solid var(--hair); background: var(--card); }
    .nav > * { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-right: 1px solid var(--hair); font: 500 15px/1 "Space Grotesk", system-ui, sans-serif; }
    .nav .spacer { flex: 1; }
    .nav .solid { background: var(--ink); color: var(--on-dark); cursor: pointer; }
    .nav .menu { width: 48px; justify-content: center; padding: 0; cursor: pointer; background: none; border: 0; border-left: 1px solid var(--hair); color: var(--ink); }
    .acc { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 16px; border-block: 1px solid var(--hair); cursor: pointer; font: 500 20px/1 "Space Grotesk", system-ui, sans-serif; background: none; border-inline: 0; width: 100%; color: inherit; }
    .tabrow { display: flex; justify-content: space-between; align-items: center; height: 56px; padding: 0 16px; border: 1px solid var(--hair-strong); border-radius: 8px; font: 500 15px/1 "Space Grotesk", system-ui, sans-serif; }
    .list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .list li { display: flex; gap: 12px; align-items: center; }
    .blue { color: var(--blue); } .alert { color: var(--alert); }
    .chips { display: flex; flex-wrap: wrap; gap: 16px; }
    .chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border: 1px solid var(--hair); background: var(--card); font: 500 18px/1 "Space Grotesk", system-ui, sans-serif; }
    .cells4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
    .cells4 > div { background: var(--card); padding: 24px; display: grid; gap: 16px; align-content: start; min-height: 200px; }
    .cells4 .art { height: 80px; display: flex; align-items: flex-end; }
    .pill { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 4px 16px 4px 4px; border-radius: 28px; border: 1px solid var(--hair); background: var(--card); font: 500 15px/1 "Space Grotesk", system-ui, sans-serif; cursor: pointer; }
    .pill:hover { background: var(--paper); }
    .pill .tile { width: 48px; height: 48px; border-radius: 24px; background: var(--paper-2); display: grid; place-items: center; }
    .band { position: relative; background: var(--blue); height: 280px; overflow: hidden; color: var(--on-dark); padding: 32px; }
    .band .stack { position: absolute; right: 64px; bottom: 0; width: 128px; }
    .band .mist { width: 64px; height: 64px; background: var(--mist); margin-left: 64px; }
    .band .indigo { width: 128px; height: 128px; background: var(--indigo); }
    .band .qb { position: absolute; left: 64px; bottom: 192px; }
    .ctaband { background: var(--ink); color: var(--on-dark); padding: 40px; }
    .cells3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--hair-dark); border: 1px solid var(--hair-dark); margin-top: 24px; }
    .cells3 > div { background: var(--ink); padding: 40px; display: grid; gap: 16px; align-content: start; min-height: 240px; }
    .cells3 > div:hover { background: var(--ink-2); }
    .cells3 p { color: var(--on-dark-body); margin: 0; }
    .socials { display: flex; gap: 24px; align-items: center; }
    .socials span { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--soft); }
    .rev-row { display: flex; gap: 64px; align-items: flex-end; margin-bottom: 16px; }
    .tstack { display: flex; flex-direction: column; }
    .tblock { display: grid; place-items: center; }
    .pill2 { display: inline-flex; align-items: center; gap: 12px; height: 40px; padding: 4px 12px 4px 4px; border-radius: 20px; border: 1px solid var(--hair); background: var(--card); color: inherit; text-decoration: none; font: 500 15px/1 "Space Grotesk", system-ui, sans-serif; margin-top: 24px; }
    .pill2:hover { background: var(--paper); }
    .tile2 { width: 32px; height: 32px; display: block; }
    .pausecell { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 47px; border: 0; border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); background: var(--card); font: 500 15px/1 "Space Grotesk", system-ui, sans-serif; color: var(--ink); cursor: pointer; }
    .cells3.rev > a.ctacell { display: grid; grid-template-columns: 48px 1fr 28px; gap: 20px; align-items: start; padding: 32px; background: var(--ink); color: var(--on-dark); text-decoration: none; min-height: 160px; }
    .cells3.rev > a.ctacell:hover { background: #222a3d; }
    .cells3.rev h4 { margin: 0 0 8px; } .cells3.rev p { margin: 0; color: var(--on-dark-body); }
    .cells3.rev .go { align-self: end; color: var(--azure); }
    #hoverlab { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <main id="root">
    <header class="top">
      <h1>Icon specimen · card 11</h1>
      <div class="mono" id="parity">parity: running…</div>
    </header>
  </main>
  <script type="module" src="./specimen.ts"></script>
</body>
</html>

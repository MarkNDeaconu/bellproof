<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bellproof · piece harness</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --card:#FBFAF7; --paper:#F4F2ED; --ink:#0E1424; --hair:#DEDBD3; --soft:#475069; --blue:#2F5BEA; --azure:#8FAEFF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--card); color: var(--ink); font: 14px/20px ui-monospace, Menlo, monospace; }
    body { display: grid; grid-template-columns: 1fr 300px; min-height: 100vh; }
    #stage { display: grid; place-items: center; min-height: 100vh; padding: 40px; background: var(--paper); position: relative; }
    #stage.index { align-content: start; justify-items: stretch; padding: 16px; }
    #stage[data-bg="ink"] { background: var(--ink); color: var(--paper); }
    #stage[data-bg="blue"] { background: var(--blue); }
    #stage[data-bg="card"] { background: var(--card); }
    #target { position: relative; }
    #target.grid::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(to right, rgba(255,0,128,.35) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,0,128,.35) 1px, transparent 1px);
      background-size: var(--unit) var(--unit); }
    aside { border-left: 1px solid var(--hair); padding: 16px; background: var(--card); overflow: auto; font-size: 12px; line-height: 18px; }
    aside h1 { font-size: 13px; margin: 0 0 8px; }
    aside dl { display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; margin: 0 0 12px; }
    aside dt { color: var(--soft); }
    aside a { color: var(--blue); }
    #all { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1px; background: var(--hair); width: 100%; }
    #all a { display: grid; gap: 8px; place-items: center; padding: 16px; background: var(--card); color: inherit; text-decoration: none; min-height: 160px; }
    #all a:hover { background: var(--paper); }
    #all small { color: var(--soft); }
    #sheetwrap { display: grid; gap: 16px; }
    #sheetwrap canvas { image-rendering: pixelated; display: block; }
    .stage-demo { width: 1280px; height: 760px; background: var(--card); border: 1px solid var(--hair); }
    .controls { display: flex; gap: 8px; margin-top: 8px; }
    .controls button { font: inherit; padding: 4px 8px; border: 1px solid var(--hair); background: var(--card); cursor: pointer; }
  </style>
</head>
<body>
  <main id="stage" data-bg="paper"><span id="target"></span></main>
  <aside id="info"><h1>piece harness</h1><p>loading…</p></aside>
  <script type="module" src="/src/preview/preview.ts"></script>
</body>
</html>
